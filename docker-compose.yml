version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:6.0
    container_name: college_events_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: college_events
    volumes:
      - mongo_data:/data/db
    networks:
      - portal_network

  # Backend REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: college_events_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/college_events
      CLIENT_URL: http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - portal_network

  # Frontend React SPA Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: college_events_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - portal_network

volumes:
  mongo_data:

networks:
  portal_network:
    driver: bridge
